<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1246 410" width="1246" height="410" role="img" aria-labelledby="title desc">
  <title id="title">ics-tools CLI demo</title>
  <desc id="desc">Real output from validating, listing, and exporting the synthetic demo calendar.</desc>
  <defs>
    <style>
      .term-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13.5px;
        letter-spacing: 0.2px;
      }
      .window-header {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #8b949e;
      }
    </style>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <rect x="0.5" y="0.5" width="1245" height="409" rx="10" ry="10" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <line x1="0" y1="38" x2="1246" y2="38" stroke="#21262d" stroke-width="1"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="6" fill="#27c93f"/>
  <text x="623" y="24" text-anchor="middle" class="window-header">ics-tools — CLI Demo</text>

  <!-- Terminal Content -->
  <g class="term-text" xml:space="preserve">
  <text x="24" y="72" fill="#7ee787" font-weight="600">$ </text><text x="40" y="72" fill="#f0f6fc" font-weight="600">ics validate examples/demo.ics</text>
  <text x="24" y="94" fill="#3fb950" font-weight="bold">VALID: examples/demo.ics</text>
  <text x="24" y="138" fill="#7ee787" font-weight="600">$ </text><text x="40" y="138" fill="#f0f6fc" font-weight="600">ics list examples/demo.ics --from 2026-01-01 --window 7d</text>
  <text x="24" y="160" fill="#8b949e" font-weight="normal">START                END                  SUMMARY                        LOCATION            </text>
  <text x="24" y="182" fill="#8b949e" font-weight="normal">---------------------------------------------------------------------------------------------</text>
  <text x="24" y="204" fill="#c9d1d9" font-weight="normal">2026-01-01 09:00     2026-01-01 10:00     Demo sync                                          </text>
  <text x="24" y="226" fill="#c9d1d9" font-weight="normal">2026-01-03 09:00     2026-01-03 10:00     Demo sync                                          </text>
  <text x="24" y="248" fill="#c9d1d9" font-weight="normal">2026-01-05 09:00     2026-01-05 10:00     Demo sync</text>
  <text x="24" y="292" fill="#7ee787" font-weight="600">$ </text><text x="40" y="292" fill="#f0f6fc" font-weight="600">ics to-csv examples/demo.ics --from 2026-01-01 --window 7d</text>
  <text x="24" y="314" fill="#8b949e" font-weight="normal">UID,Summary,Description,Location,Start,End,Duration,AllDay,Status,RecurrenceId</text>
  <text x="24" y="336" fill="#c9d1d9" font-weight="normal">demo-event@example.invalid,Demo sync,,,2026-01-01T09:00:00+00:00,2026-01-01T10:00:00+00:00,1:00:00,FALSE,CONFIRMED,2026-01-01T09:00:00+00:00</text>
  <text x="24" y="358" fill="#c9d1d9" font-weight="normal">demo-event@example.invalid,Demo sync,,,2026-01-03T09:00:00+00:00,2026-01-03T10:00:00+00:00,1:00:00,FALSE,CONFIRMED,2026-01-03T09:00:00+00:00</text>
  <text x="24" y="380" fill="#c9d1d9" font-weight="normal">demo-event@example.invalid,Demo sync,,,2026-01-05T09:00:00+00:00,2026-01-05T10:00:00+00:00,1:00:00,FALSE,CONFIRMED,2026-01-05T09:00:00+00:00</text>
  </g>
</svg>
