name: Publish
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Check tag and package version
        run: python -c "import os; from importlib.metadata import version; from ics_tools import __version__; assert version('ics-tools') == __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
