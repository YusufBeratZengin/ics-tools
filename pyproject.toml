[build-system]
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ics-tools"
version = "0.1.0"
description = "Python library and CLI to parse, merge, filter and validate iCalendar (.ics) files with RRULE expansion"
readme = "README.md"
authors = [
    { name = "Yusuf Berat Zengin", email = "118852217+YusufBeratZengin@users.noreply.github.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = [
    "icalendar",
    "ics",
    "rfc5545",
    "calendar",
    "rrule",
    "events",
    "parser",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/ics-tools"
Documentation = "https://github.com/YusufBeratZengin/ics-tools#readme"
Repository = "https://github.com/YusufBeratZengin/ics-tools.git"
Issues = "https://github.com/YusufBeratZengin/ics-tools/issues"
Changelog = "https://github.com/YusufBeratZengin/ics-tools/blob/main/CHANGELOG.md"

[project.scripts]
ics = "ics_tools.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
]
