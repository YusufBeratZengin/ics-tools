[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ics-tools"
version = "0.1.0"
description = "Python library and CLI to parse, merge, filter and validate iCalendar (.ics) files with RRULE expansion"
readme = "README.md"
authors = [
    { name = "Yusuf Berat Zengin" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = [
    "icalendar",
    "ics",
    "rfc5545",
    "calendar",
    "rrule",
    "events",
    "parser",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/ics-tools"
Documentation = "https://github.com/YusufBeratZengin/ics-tools#readme"
Repository = "https://github.com/YusufBeratZengin/ics-tools.git"
Issues = "https://github.com/YusufBeratZengin/ics-tools/issues"
Changelog = "https://github.com/YusufBeratZengin/ics-tools/blob/main/CHANGELOG.md"

[project.scripts]
ics = "ics_tools.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Keep checks usable in restricted workspaces without writing pytest caches.
addopts = "-p no:cacheprovider"
filterwarnings = [
    "error",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ics_tools"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/*.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["is", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "S"]
ignore = ["S101"]
allowed-confusables = ["ı"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true

[tool.coverage.run]
source = ["ics_tools"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
